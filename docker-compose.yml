version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - game-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/api_combat_game.db
      - JWT__Secret=your-super-secret-jwt-key-minimum-32-characters-long-change-in-production
      - JWT__Issuer=ApiCombatGame
      - JWT__Audience=ApiCombatGamePlayers
      - JWT__ExpirationMinutes=60
    restart: unless-stopped

volumes:
  game-data:
